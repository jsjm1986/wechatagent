          name: real-llm-ledger-roleplayer-calibration
          path: target/real_llm_ledger/
          if-no-files-found: ignore
          retention-days: 30

  # ════════════════════════════════════════════════════════════════════════════
  # R0.2：skip 率硬门（汇总）。各 real-llm job 是 continue-on-error（conclusion 恒
  # success，端点抖动不卡合并），但**大面积 transient-skip = 这一轮真模型测试实际
  # 没验证到能力 = 假绿**。本 job 非 continue-on-error，needs 9 个 PR 门真模型 job，
  # 汇总它们传出的 skip_ledger.jsonl，skip 总数超阈值即真红卡合并。
  # 缺 key（fork PR/没配 secret）时上游 job 在其 fail-gate 已红，本 job 因
  # needs 失败而 skipped，不会假绿。
  skip-gate:
    name: Real-LLM skip 率硬门 (R0.2)
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' }}
    needs: [real-llm, real-llm-recall, real-llm-ops, real-llm-quality, real-llm-adversarial, real-llm-redline, real-llm-autonomy-redline, real-llm-conversation-judge, real-llm-roleplayer-calibration]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # 汇总所有真模型 job 传出的 ledger（含 skip_ledger.jsonl）到一个目录。
      # pattern 覆盖各 job 的命名：real-llm-skip-ledger-* / real-llm-recall-ledger-* /
      # real-llm-ledger-*（quality/adversarial）。merge-multiple 把多 artifact 合进同目录。
      - name: Download all skip ledgers
        uses: actions/download-artifact@v4
        with:
          path: target/real_llm_ledger
          pattern: "*ledger*"
          merge-multiple: true
      - name: Check skip rate
        env:
          REAL_LLM_LEDGER: target/real_llm_ledger
          # 9 个 PR 门真模型 job 汇总（各写独立子目录、find 递归求和），放宽到 20（单 job ~3-16 测试，端点偶发抖动允许少量；持续抖动致大面积 skip 才红）。
          REAL_LLM_MAX_SKIP: "20"
        run: bash scripts/check-skip-ledger.sh
