      # qwen（ROLEPLAYER_*，异端点不占 rsxermu 并发）。JUDGE_SAMPLES=1 守端点上限 2（realism
      # 裁判单裁判内 K=1，靠跨裁判 median-of-median）。roleplayer 生成三手法串行不并发。
      - name: cargo test --test real_llm_roleplayer_calibration (J3 校准)
