name: CI

# 同一 PR/push 只保留最新 run，取消旧 run——避免重复排队浪费 runner 资源。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    # 纯文档改动不触发后端 CI。前端改动**会**触发 workflow(下方 changes job 用 paths-filter
    # 细分 backend/frontend,baseline/integration 仅 backend 路径才跑、frontend-contract 仅
    # frontend 路径才跑),既让前端契约对账进合并门,又不在纯前端 PR 上烧后端/真模型配额。
    # frontend/src/contracts/** 归 backend(fixture 由后端 bless,改它须跑 baseline 投影测试)。
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  # nightly 全量真模型能力套件回归：smoke/recall/ops/quality/adversarial 这 5 组
  # （全 continue-on-error，对合并无否决权，纯回归监控）从 PR/push 移到此处，避免每次
  # 推送都全量跑 1+ 小时真模型串行链 + 烧 API 配额。PR 只留 baseline/integration/红线门/
  # skip-gate。schedule 不受 paths-ignore 影响（全量跑）。北京时间约 03:17（UTC 19:17），
  # 避开整点减 GitHub 调度拥塞。
  schedule:
    - cron: '17 19 * * *'
  # 手动触发：单项诊断目标绕过 needs；nightly_full 则复用完整 nightly 串行依赖链。
  # - dispatch_target=ops（默认）：单独跑某一个 real_llm_ops_smoke 测试（填 ops_test，默认 t15），
  #   不必等 real-llm → recall → ops 串行排队 1+ 小时。
  # - dispatch_target=roleplay_docker：只跑 roleplay-fuzz P0 那几个需要 Docker（testcontainers
  #   MongoDB）的 #[ignore] 夹具自验证测试（无需任何 LLM key），不跑完整 CI、不烧真模型配额。
  # 在 Actions 页选 CI workflow → Run workflow → 选 target（+ 必要时填 ops_test）。
  workflow_dispatch:
    inputs:
      dispatch_target:
        description: '手动目标（nightly_full=完整真模型链；其余为单项诊断）'
        required: true
        default: 'ops'
        type: choice
        options:
          - ops
          - nightly_full
          - smoke_t4
          - roleplay_docker
          - roleplay_p2
          - reviewer_calibration
          - roleplay_arc
      ops_test:
        description: '当 target=ops 时单独跑的 real_llm_ops_smoke 测试名（如 t15_real_multiturn_deal_arc）'
        required: false
        default: 't15_real_multiturn_deal_arc'
        type: string

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  # Production and deep async integration paths use an 8 MiB Rust thread stack. Keep this at
  # workflow scope so every current and future test harness gets the same runtime contract.
  RUST_MIN_STACK: "8388608"

jobs:
  # 路径分流:PR 上用 dorny/paths-filter 判定本次 diff 碰了 backend 还是 frontend。
  # baseline/integration 仅 backend 变更跑;frontend-contract 仅 frontend 变更跑。
  # 非 PR 事件(push/schedule/workflow_dispatch)无 PR diff 基线,filter 输出按"变更"处理,
  # 下游 job 的 if 用 `!= 'false'` 兜底(缺省也跑),保证 push/schedule 全量不被误跳。
  changes:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' }}
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
              - 'frontend/src/contracts/**'
            frontend:
              - 'frontend/**'

  baseline:
    name: Baseline gate (R11.6)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name != 'workflow_dispatch' && needs.changes.outputs.backend != 'false' }}
    timeout-minutes: 30
    steps:
      - name: Checkout (with full history for diff)
        uses: actions/checkout@v4
        with:
          # check-no-human-takeover 需要 BASE..HEAD 增量扫描；fetch-depth: 0
          # 把整段历史拉下来才能在 PR 路径上比 main。
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry / target
        uses: Swatinem/rust-cache@v2

      - name: cargo test --lib (R11.6 baseline part 1)
        run: cargo test --lib

      - name: scripts/check-baseline.sh (lib + 4 PBT files)
        shell: bash
        run: bash scripts/check-baseline.sh

      - name: scripts/check-no-human-takeover.sh (literal lint)
        shell: bash
        env:
          # PR 路径：与目标分支 diff；push 到 main 时与上一个 commit diff。
          BASE_REF: ${{ github.event.pull_request.base.ref || 'HEAD~1' }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash scripts/check-no-human-takeover.sh "origin/${BASE_REF}" "HEAD"
          else
            bash scripts/check-no-human-takeover.sh "${BASE_REF}" "HEAD"
          fi

      - name: scripts/check-no-model-hint.sh (literal lint)
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'HEAD~1' }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash scripts/check-no-model-hint.sh "origin/${BASE_REF}" "HEAD"
          else
            bash scripts/check-no-model-hint.sh "${BASE_REF}" "HEAD"
          fi

      - name: scripts/check-evolution-isolation.sh (R1.6 / R8.4 / R9.4)
        shell: bash
        run: bash scripts/check-evolution-isolation.sh

      - name: scripts/test-ci-lints.sh (红线 lint 词表 drift 自测)
        shell: bash
        run: bash scripts/test-ci-lints.sh

      # SR-004: keep critical business/security evidence blocking while the broad
      # Docker suite and variable model-quality suites remain diagnostic/nightly.
      - name: Check CI hard/soft gate policy (SR-004)
        run: python3 scripts/check-ci-gate-policy.py

  integration:
    name: Integration tests (Docker / testcontainers)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name != 'workflow_dispatch' && needs.changes.outputs.backend != 'false' }}
    # 首次接入：101 个 #[ignore] 集成测试从未在 CI 跑过，bit-rot 几乎必然。
    # 先 continue-on-error 拿到真实绿/红体检报告，不阻塞合并；逐个修复后
    # 再视情况抬升为硬门（与 baseline 同级）。
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ubuntu-latest 自带 ~14GB 可用磁盘，预装大量 SDK（Android / .NET /
      # GHC / Haskell / CodeQL 等）。本 job 现在要编译 100+ 个集成测试二进制
      # （pdf-extract / feed-rs / scraper / jsonwebtoken 等已审计依赖让 target
      # 体积进一步膨胀），target 目录会在 testcontainers 拉 mongo:5.0.6 镜像
      # 之前把磁盘塞满，导致 "no space left on device / failed to register
      # layer"，全部集成测试在容器启动处 panic。先清掉用不到的预装 SDK
      # 腾出 ~30GB，再进入构建。
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/powershell \
            /usr/lib/jvm "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry / target
        uses: Swatinem/rust-cache@v2

      # ubuntu-latest runner 预装 Docker daemon；testcontainers
      # （tests/common/mod.rs:116 `Mongo::default().start()`）自动拉起
      # 临时 MongoDB 容器，无需额外 service 声明。
      #
      # 关掉全局 RUSTFLAGS=-Dwarnings：这 38 个 #[ignore] 测试文件从未在
      # 新 rustc 下编译过，借用检查器进步会把陈年 `unused_mut`/`unused_var`
      # 变成 warning。warnings-as-errors 会让 cargo 在跑任何一个测试前就编译
      # 失败，与本 job「拿真实绿/红测试分布」的目的相悖。production lib 代码
      # 的 -Dwarnings 仍由 baseline job 守住。
      - name: cargo test --no-fail-fast -- --ignored (testcontainers MongoDB)
        env:
          RUSTFLAGS: ""
          # 与生产 systemd(RUST_MIN_STACK=8388608)对齐。集成测试在 2MB 默认子线程栈
          # 上跑,深 async 栈帧(如 gateway relay 路径)会栈溢出 SIGABRT(无 panic 文本);
          # 生产早已设 8MB,CI 此前缺失是配置缺口。
          RUST_MIN_STACK: "8388608"
        # --no-fail-fast：跑完所有 test 二进制再汇总，不在第一个失败的二进制处
        # abort（cargo 默认 fail-fast 会 exit 101 后跳过剩余 ~96 个测试，拿不到
        # 真实绿/红分布）。本 job continue-on-error，失败不阻塞合并。
        run: cargo test --no-fail-fast -- --ignored

  knowledge-evidence-gate:
    name: Knowledge evidence gate (SR-126)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name != 'workflow_dispatch' && needs.changes.outputs.backend != 'false' }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/powershell \
            /usr/lib/jvm "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry / target
        uses: Swatinem/rust-cache@v2

      # Keep the broad ignored suite as a soft diagnostic job. These five behaviors are the
      # blocking evidence for retrieval ranking, Chat apply/verify/recall, and Worker outcomes.
      - name: Run production-ranked recall, real maintenance loop, and Worker verdicts
        shell: bash
        env:
          RUSTFLAGS: ""
          RUST_MIN_STACK: "8388608"
        run: |
          recall_count="$(cargo test --test knowledge_agent_eval -- --list | grep -c '^knowledge_agent_eval_set_meets_thresholds: test$')"
          test "$recall_count" -eq 1
          loop_count="$(cargo test --test knowledge_closed_loop_trajectory -- --list | grep -c '^chat_apply_verify_then_answer_is_auditable_closed_loop: test$')"
          test "$loop_count" -eq 1
          verdict_count="$(cargo test --test knowledge_worker_behavior_integration -- --list | grep -c '^execute_step_reports_typed_business_verdicts: test$')"
          test "$verdict_count" -eq 1
          committed_count="$(cargo test --test knowledge_worker_behavior_integration -- --list | grep -c '^committed_add_has_real_draft_side_effect: test$')"
          test "$committed_count" -eq 1
          summary_count="$(cargo test --test knowledge_worker_behavior_integration -- --list | grep -c '^run_task_persists_mixed_verdict_buckets: test$')"
          test "$summary_count" -eq 1
          cargo test --test knowledge_agent_eval knowledge_agent_eval_set_meets_thresholds -- --ignored --exact --nocapture
          cargo test --test knowledge_closed_loop_trajectory chat_apply_verify_then_answer_is_auditable_closed_loop -- --ignored --exact --nocapture
          cargo test --test knowledge_worker_behavior_integration execute_step_reports_typed_business_verdicts -- --ignored --exact --nocapture
          cargo test --test knowledge_worker_behavior_integration committed_add_has_real_draft_side_effect -- --ignored --exact --nocapture
          cargo test --test knowledge_worker_behavior_integration run_task_persists_mixed_verdict_buckets -- --ignored --exact --nocapture

  tenant-isolation-security:
    name: Tenant isolation security gate (SR-176)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name != 'workflow_dispatch' && needs.changes.outputs.backend != 'false' }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This hard gate compiles only the two real-entrypoint test binaries. Keep the
      # broad ignored integration suite above as a soft diagnostic job.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/powershell \
            /usr/lib/jvm "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry / target
        uses: Swatinem/rust-cache@v2

      - name: Run real Router and expired-session redlines
        shell: bash
        env:
          RUSTFLAGS: ""
          RUST_MIN_STACK: "8388608"
        run: |
          router_count="$(cargo test --test sr176_real_route_isolation -- --list | grep -c '^sr176_real_router_enforces_read_write_and_expired_session_boundaries: test$')"
          test "$router_count" -eq 1
          auth_count="$(cargo test --test auth_middleware_integration -- --list | grep -c '^expired_session_rejected_and_logout_idempotent: test$')"
          test "$auth_count" -eq 1
          cargo test --test sr176_real_route_isolation sr176_real_router_enforces_read_write_and_expired_session_boundaries -- --ignored --exact --nocapture
          cargo test --test auth_middleware_integration expired_session_rejected_and_logout_idempotent -- --ignored --exact --nocapture

  frontend-contract:
    name: 前端契约对账 (tsc + vitest)
    runs-on: ubuntu-latest
    needs: changes
    # 仅前端变更跑(契约对账进合并门)。非 PR 事件 filter 输出非 'false' 也跑一次兜底。
    if: ${{ github.event_name != 'workflow_dispatch' && needs.changes.outputs.frontend != 'false' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: 类型检查
        working-directory: frontend
        run: npx tsc --noEmit
      - name: 契约对账 + 组件测试
        working-directory: frontend
        run: npx vitest run

  real-llm:
    name: Real-LLM smoke (真实大模型 / MCP 桩)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dispatch_target == 'nightly_full') }}
    # 并发治理：作为 5 个 real-llm group 串行链的链头（smoke→recall→ops→quality→adversarial，
    # 各组 max-parallel:1）→ 全局任意时刻仅 1 matrix 实例打 rsxermu → 守并发上限 2。
    # （GitHub job-level concurrency group 不能串行化同 run 内 matrix，会 cancel 而非排队，故用 needs 链。）
    # 用**真实大模型**（rsxermu claude-opus-4-8 / gpt-5.4）跑 T1 文本决策+审查 / T2 知识
    # tool-loop / T3 多模态 vision 抽取，验证 mock 测不到的真实 schema/闸门/收敛。
    # MCP 永远是 wiremock 桩（绝不真发微信）。real-LLM 限流/抖动不该阻塞合并，
    # 故 continue-on-error；conclusion 恒 success，必看 job 日志拿真实绿/红。
    continue-on-error: true
    timeout-minutes: 90
    # 密钥提到 job 级 env：GitHub Actions 的 job 级 `if:` 读不到 secrets 上下文，
    # 但 step 级 `if:` 能读 env，故下方各重步用 `if: env.REAL_LLM_API_KEY != ''`
    # 守卫——未配 secret（fork PR / 没配）时直接跳过编译/跑测，不浪费 CI 分钟、不红。
    # provider 沿革（2026-06-16）：全部真模型 job 迁到 rsxermu666.cn 不限流端点——被测主模型
    # claude-opus-4-8（Anthropic 格式 /v1/messages）、judge/vision gpt-5.4（OpenAI /v1，端点强制
    # 流式 SSE 由 LlmClient 聚合兜底）。NVIDIA 仅作可选第三异族裁判（独立 NVIDIA_KEY，缺则回落
    # claude+gpt 两族，不 fail）。key 走 secret RSXERMU_KEY，删除原 17 处明文 nvapi 字面量回落。
    env:
      REAL_LLM_API_KEY: ${{ secrets.RSXERMU_KEY }}
    steps:
      - name: Require REAL_LLM_API_KEY (R0.1 缺 key 真 fail，不假绿)
        if: ${{ env.REAL_LLM_API_KEY == '' }}
        run: |
          echo "::error::REAL_LLM_API_KEY 未配置（secrets.RSXERMU_KEY 为空）。real-llm job 必须有 key 才能真跑——缺 key 直接 fail，不静默跳过假绿（R0.1）。"
          exit 1
      - name: Checkout
        uses: actions/checkout@v4

      # 同 integration job：清预装 SDK 腾 ~30GB，否则 target + mongo 镜像撑爆磁盘。
      - name: Free disk space
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/powershell \
            /usr/lib/jvm "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install Rust toolchain
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry / target
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        uses: Swatinem/rust-cache@v2

      # rust-cache may restore target/real_llm_ledger from an older run. Start this producer
      # with an empty ledger so stale capability outcomes can never be uploaded as current proof.
      - name: Reset real-LLM evidence ledger
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        shell: bash
        run: rm -rf target/real_llm_ledger && mkdir -p target/real_llm_ledger

      # 真实大模型 smoke：T1/T2/T3 默认 #[ignore]，靠 --ignored 触发。
      # 密钥只走 GitHub Secrets（REAL_LLM_API_KEY），永不进代码/日志；
      # 端点 / 模型名是非密钥，可硬写。--nocapture 让 eprintln! 的 skip/诊断
      # 行进 CI 日志。关 -Dwarnings 同 integration job 理由（测试文件陈年
      # warning 不该阻断真实跑测）。
      - name: cargo test --test real_llm_smoke -- --ignored --nocapture
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        env:
          RUSTFLAGS: ""
          RUST_MIN_STACK: "8388608"
          # 文本主链路（T1/T2）走 claude-opus-4-8（rsxermu666.cn，Anthropic /v1/messages，非流式）。
          REAL_LLM_BASE_URL: https://rsxermu666.cn
          REAL_LLM_MODEL: claude-opus-4-8
          REAL_LLM_FORMAT: anthropic
          # vision（T3）：claude 的 Anthropic 图片 block 未实现，故使用 NVIDIA 专职视觉模型；
          # 与文本主模型的 RSXERMU key/端点解耦，避免无 GPT vision 权限的 copilot key 返回 403。
          REAL_LLM_VISION_API_KEY: ${{ secrets.NVIDIA_KEY }}
          REAL_LLM_VISION_BASE_URL: https://integrate.api.nvidia.com/v1
          REAL_LLM_VISION_MODEL: nvidia/nemotron-nano-12b-v2-vl
        run: cargo test --no-fail-fast --test real_llm_smoke -- --ignored --nocapture

      # ════════════════════════════════════════════════════════════════════════════
      # universal-domain-adaptation 3C：DomainProfile 端到端（AI 生成候选 → publish
      # → activate → 运行时加载）。走 claude-opus-4-8（rsxermu，Anthropic）验证 profile 生成链路。
      # 与 real_llm_smoke 同 env/key/guard。
      - name: cargo test --test domain_profile_e2e -- --ignored --nocapture
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        env:
          RUSTFLAGS: ""
          REAL_LLM_BASE_URL: https://rsxermu666.cn
          REAL_LLM_MODEL: claude-opus-4-8
          REAL_LLM_FORMAT: anthropic
        run: cargo test --test domain_profile_e2e -- --ignored --nocapture

      # 知识库全能力 smoke（real_llm_knowledge.rs K1–K9）：渐进式披露检索
      # （open_chunk 深检索 / follow_relations 关系跳转 / 无幻觉 / 未审定不上桌）
      # + 抽取全能力（文章抽取 / 多模态图片抽取 / 自动审定 provenance 闸门 /
      # AI 修复只产 patch / 标签抽取）。与 T1–T3 同环境，MCP 仍是桩；
      # 红线：抽取/落库 chunk 恒 draft+needs_review，AI 永不自动 verify。
      # !cancelled()：本步不依赖前面 real_llm_smoke 步的绿/红。GitHub Actions 默认
      # 前一步 fail 就跳过后续步（real_llm_smoke 由另一 agent 维护，其偶发失败
      # 不该把知识库 K1–K9 套件一并跳过，否则知识库永远拿不到真实绿/红体检）。
      - name: cargo test --test real_llm_knowledge -- --ignored --nocapture
        if: ${{ !cancelled() && env.REAL_LLM_API_KEY != '' }}
        env:
          RUSTFLAGS: ""
          # 文本知识链路（K1–K5/K7–K11）走 claude-opus-4-8（rsxermu，Anthropic /v1/messages）。
          REAL_LLM_BASE_URL: https://rsxermu666.cn
          REAL_LLM_MODEL: claude-opus-4-8
          REAL_LLM_FORMAT: anthropic
          # vision（K6）：使用 NVIDIA 专职视觉模型，避免把无 GPT vision 权限的 RSXERMU key
          # 误接到 gpt-5.4；瞬时 5xx/超时仍按 LlmUnavailable 记录并由汇总门判定。
          REAL_LLM_VISION_API_KEY: ${{ secrets.NVIDIA_KEY }}
          REAL_LLM_VISION_BASE_URL: https://integrate.api.nvidia.com/v1
          REAL_LLM_VISION_MODEL: nvidia/nemotron-nano-12b-v2-vl
        run: cargo test --no-fail-fast --test real_llm_knowledge -- --ignored --nocapture

      # R0.2：传出 skip ledger（含 unwrap_or_skip_transient! 写的 skip_ledger.jsonl），
      # 供下游 skip-gate job 汇总校验 skip 率。
      - name: Upload skip ledger
        if: ${{ always() && env.REAL_LLM_API_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: real-llm-skip-ledger-smoke
          path: target/real_llm_ledger/
          if-no-files-found: ignore
          retention-days: 30

  # ════════════════════════════════════════════════════════════════════════════
  # 知识库**召回率量化基准**（real_llm_recall_benchmark.rs）——业务闭环核心北极星：
  # 文档抽取入库 → 运营 agent 渐进式披露检索召回 → agent 自然语言维护知识库后召回保持。
  # 覆盖：⓪ 跨轮稳定性（同 query 跑 N 次召回集是否一致，测 LLM agent 决策方差）；
  # ② 召回率 recall@k（reach 触达层 = opened∪cited / adopt 采纳层 = cited，按 overall /
  # lexical-easy / adversarial 三组报，adversarial 由客观 bigram 重叠度量 < 0.15 划分，
  # 非人工标，防过拟合）；③ 真实 chat 改库全链路（新增/改写/废弃）后召回保持。
  # 跨行业大语料矩阵（零售/SaaS/金融/教育/医疗/制造 6 行业 × 多文档类型）做通用性测试。
  # 第一轮只观测 baseline，唯一硬红线 = 召回集⊆seed（出现 seed 外 id 即真 bug，立即 fail）。
  # 与 quality matrix 解耦——独立 job，不抢 Q1-Q8 收敛判据。MCP 永远是桩（绝不真发微信）。
  # 文本主链走 NVIDIA integrate kimi-k2.6；real-LLM 抖动 continue-on-error 不阻塞合并。
  #
  # 按测试拆 matrix 并行（仿 real-llm-ops / real-llm-quality）：三个测试各享独立 runner +
  # 独立 45min 墙，互不阻塞（fail-fast:false），各自只 `cargo test <name>` 跑自己那片，抗墙腰斩。
  # - recall_benchmark_smoke：单 query 冒烟，确认端点/检索链路在 CI 能跑通（最轻）。
  # - recall_benchmark_cross_industry：⓪跨轮稳定 + ②reach/adopt 分组召回，6 行业矩阵 × N 轮（最重）。
  # - recall_benchmark_maintenance_stability：③真实 chat 改库全链路（新增/改写/废弃）后召回保持。
  # - recall_benchmark_gap_closed_loop_trajectory：北极星全闭环单测——召回 gap → agent 主动
  #   提问 → 运营对话补库（chat 新建切片，溯源=运营陈述）→ verify 通过 → 同 query 再召回命中。
  # max-parallel:2 限流——与 ops/quality/adversarial 共用同一把 NVIDIA key，限并发防瞬时 429；
  # 队列中的 matrix job 不启动 timeout 计时，故每测试仍独享完整 45min 墙，限流只推迟开始不吃墙。
  real-llm-recall:
    name: Real-LLM knowledge recall benchmark (${{ matrix.t }} / MCP 桩)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dispatch_target == 'nightly_full') }}
    # NVIDIA integrate 免费层 RPM 硬墙：5 个 real-LLM job-group 并行时瞬时 ~9 runner 同打
    # 一把 key 必爆 429（实测 retry 6 次仍全 skip 假绿）。max-parallel 只在单 matrix 内限并发、
    # 不能跨 group 协调，故用 needs 链把 5 个 group 串行化（smoke→recall→ops→quality→adversarial），
    # 各 group 内 max-parallel:1 → 全局任意时刻仅 1 runner 打 NVIDIA，根治跨 group 429 风暴。
    # continue-on-error:true 使 conclusion 恒 success，needs 链不会因前置假失败中断。
    # 并发治理（2026-06-16 迁 rsxermu 后）：rsxermu666.cn 允许并发 2，但单个 real-llm job 内部
    # judge panel 已可能瞬时打 2 路。GitHub job-level concurrency group 不能串行化同一 run 内的
    # matrix/jobs（同 group 并行成员会被 cancel 而非排队），故仍用 needs 链把 5 个 group 串行化
    # （smoke→recall→ops→quality→adversarial）+ 各组 max-parallel:1 → 全局任意时刻仅 1 matrix 实例
    # 在跑 → 守 rsxermu 并发上限 2。continue-on-error:true 使 conclusion 恒 success，needs 链不中断。
    needs: real-llm
    continue-on-error: true
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        t:
          - recall_benchmark_smoke
          - recall_benchmark_cross_industry
          - recall_benchmark_maintenance_stability
          - recall_benchmark_gap_closed_loop_trajectory
    env:
      REAL_LLM_API_KEY: ${{ secrets.RSXERMU_KEY }}
    steps:
      - name: Require REAL_LLM_API_KEY (R0.1 缺 key 真 fail，不假绿)
        if: ${{ env.REAL_LLM_API_KEY == '' }}
        run: |
          echo "::error::REAL_LLM_API_KEY 未配置（secrets.RSXERMU_KEY 为空）。real-llm job 必须有 key 才能真跑——缺 key 直接 fail，不静默跳过假绿（R0.1）。"
          exit 1
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/powershell \
            /usr/lib/jvm "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install Rust toolchain
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry / target
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        uses: Swatinem/rust-cache@v2

      # Every matrix shard uploads its own artifact. Clear cached evidence first so each shard
      # contributes only outcomes produced by this run/attempt.
      - name: Reset real-LLM evidence ledger
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        shell: bash
        run: rm -rf target/real_llm_ledger && mkdir -p target/real_llm_ledger

      # 召回率基准：默认 #[ignore]，靠 --ignored 触发。文本主链 kimi-k2.6
      # （NVIDIA integrate，OpenAI 兼容）。RECALL_STABILITY_RUNS 控制每条 query 跑几次量化
      # 跨轮稳定性（首版 N=3 抗墙，spec 定稿 5；矩阵 6 行业 × N 调用量大，先 3 跑通再放开）。
      # --nocapture 让 [RECALL] / [RECALL-MAINT] ledger 行进 CI 日志。关 -Dwarnings 同知识库
      # job（测试文件陈年 warning 不阻断真实跑测）。硬红线⊆seed 之外只观测不 panic。
      - name: cargo test --test real_llm_recall_benchmark ${{ matrix.t }}
        if: ${{ !cancelled() && env.REAL_LLM_API_KEY != '' }}
        env:
          RUSTFLAGS: ""
          REAL_LLM_BASE_URL: https://rsxermu666.cn
          REAL_LLM_MODEL: claude-opus-4-8
          REAL_LLM_FORMAT: anthropic
          RECALL_STABILITY_RUNS: "3"
        run: cargo test --no-fail-fast --test real_llm_recall_benchmark ${{ matrix.t }} -- --ignored --nocapture

      - name: Upload recall ledger
        if: ${{ always() && env.REAL_LLM_API_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: real-llm-recall-ledger-${{ matrix.t }}
          path: target/real_llm_ledger/
          if-no-files-found: ignore
          retention-days: 30

  # 运营 agent 全能力 smoke（real_llm_ops_smoke.rs t4–t18）。原先是**单 job 跑全部
  # 15 个测试**（cargo 默认进程内并行 + 每个多轮弧 t15/t16/t17 各发数十次 LLM 调用 +
  # K=3 judge 采样），15 个 #[tokio::test] 同时冲同一把 MiMo key → 瞬时请求峰值远超
  # 上游配额 → 体检显示 9/15 全因 `LlmUnavailable rate_limited`(HTTP 429) panic（**非
  # 回归、非断言失败**），且把 t14_real_profile_churn_under_weak_signal（画像写侧弱信号
  # 体检，cautious-profiling 跨样本数据的唯一来源）在 assert 前就打挂——仪器把自己的
  # 结论给屏蔽了。
  #
  # 兄弟套件（knowledge-quality 7 Q、adversarial 7 弧）早已用「按测试名 matrix 拆并行 +
  # max-parallel:2」根治同一 429 风暴，本 run 它们 7/7 全绿；唯独 ops-smoke 是漏网的
  # 单体 job。这里把它对齐成同一形态：每个测试一个独立 matrix job，max-parallel:2 把跨
  # job 瞬时并发压到 ~2，每个 job 进程内只跑一个测试（并发塌到该测试自身的串行调用）。
  # 队列中的 matrix job 不启动 timeout 计时，故每测试仍独享完整 45min 墙，限流只推迟
  # 开始不吃墙。零 src/ 改动（agent 冻结），纯仪器抗 429。MCP 仍是桩（绝不真发微信）。
  # 端点沿革：MiMo（429）→ deepseek（api.supxh.xin，令牌 2026-06-03 过期/无效）→ 切回
  # MiMo mimo-v2.5（api.xiaomimimo.com，用户指定），与 adversarial 被测 agent 同模型、
  # 同 key（secret REAL_LLM_MIMO_API_KEY，缺则回落字面量）。
  real-llm-ops:
    name: Real-LLM ops smoke (${{ matrix.t }} / MCP 桩)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dispatch_target == 'nightly_full') }}
    # 串行链第 3 环（见 real-llm-recall 注释：跨 group 串行守 rsxermu 并发 2）。
    needs: real-llm-recall
    continue-on-error: true
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        t:
          - t4_real_follow_up_task_runs_and_expiry_blocks
          - t5_real_state_machine_transition_stays_in_dictionary
          - t6_real_unverified_product_claim_is_gated
          - t7_real_multi_scenario_generality
          - t8_real_autonomy_mode_stays_in_ai_internal_set
          - t9_real_user_reaction_outcome_in_closed_set
          - t10_real_initial_profile_generation
          - t11_real_memory_consolidation_merges_candidates
          - t12_real_steerability_honors_custom_instructions
          - t13_real_persona_differentiation
          - t14_real_profile_churn_under_weak_signal
          - t15_real_multiturn_deal_arc
          - t16_real_multiturn_persona_cross
          - t17_real_multiturn_boundary_stress
          - t18_real_warm_start_operator_seeded_arc
    env:
      REAL_LLM_API_KEY: ${{ secrets.RSXERMU_KEY }}
    steps:
      - name: Require REAL_LLM_API_KEY (R0.1 缺 key 真 fail，不假绿)
        if: ${{ env.REAL_LLM_API_KEY == '' }}
        run: |
          echo "::error::REAL_LLM_API_KEY 未配置（secrets.RSXERMU_KEY 为空）。real-llm job 必须有 key 才能真跑——缺 key 直接 fail，不静默跳过假绿（R0.1）。"
          exit 1
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/powershell \
            /usr/lib/jvm "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install Rust toolchain
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry / target
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        uses: Swatinem/rust-cache@v2

      # 单个运营 agent 能力测试：FollowUp 任务 / 状态机字典闭集 / 未验证产品声明闸门 /
      # 多场景通用性 / autonomy 闭集 / 用户反应 outcome 闭集 / 冷启动初始画像 / 长期
      # 记忆整理 / 可操控性 / 千人千面 / 画像写侧弱信号体检（t14）/ 多轮深弧 + 边界
      # 压测（t15/t16/t17）/ 暖启动种子弧（t18）+ K=3 采样并发 judge + 全能力逐轮快照。
      # REAL_LLM_JUDGE=1 打开 judge 诊断。被测主模型 claude-opus-4-8（rsxermu，Anthropic）；
      # MCP 仍是桩（绝不真发微信）。
      - name: cargo test --test real_llm_ops_smoke ${{ matrix.t }}
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        env:
          RUSTFLAGS: ""
          REAL_LLM_BASE_URL: https://rsxermu666.cn
          REAL_LLM_MODEL: claude-opus-4-8
          REAL_LLM_FORMAT: anthropic
          REAL_LLM_JUDGE: "1"
          JUDGE_SAMPLES: "1"
          # 裁判用异族 gpt-5.4（rsxermu OpenAI /v1，端点强制流式 SSE 由 LlmClient 聚合兜底）——被测
          # claude 与裁判 gpt 天然跨家族，G-Eval/MT-Bench 方法论判分更可信。judge 走独立 JUDGE_*
          # 端点（claude 走 /v1/messages、gpt 走 /v1/chat/completions，端点串异故必须独立接线）。
          REAL_LLM_JUDGE_API_KEY: ${{ secrets.RSXERMU_KEY }}
          REAL_LLM_JUDGE_BASE_URL: https://rsxermu666.cn/v1
          REAL_LLM_JUDGE_MODEL: gpt-5.4
          REAL_LLM_JUDGE_FORMAT: openai
        run: cargo test --no-fail-fast --test real_llm_ops_smoke ${{ matrix.t }} -- --ignored --nocapture

      # R0.2：传出 skip ledger 供下游 skip-gate 汇总。
      - name: Upload skip ledger
        if: ${{ always() && env.REAL_LLM_API_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: real-llm-skip-ledger-ops-${{ matrix.t }}
          path: target/real_llm_ledger/
          if-no-files-found: ignore
          retention-days: 30

  # 手动单跑：只跑 workflow_dispatch input 指定的**单个** real_llm_ops_smoke 测试，
  # **无 needs 前置链**，触发后立即起跑——用于快速验证单测修复（如 t15），不必等
  # real-llm → recall → ops 串行排队 1+ 小时。env 与 real-llm-ops 完全同口径（同主模型
  # kimi-k2.6 / 同异族 judge llama-3.3-70b / 同 failover 备胎链），保证单跑结果与全套
  # 一致、可直接采信。仅 workflow_dispatch 事件触发；正常 PR/push 跑全套矩阵不受影响。
  # MCP 仍是桩（绝不真发微信）。
  real-llm-ops-single:
    name: Real-LLM ops single (${{ github.event.inputs.ops_test }} / 手动单跑)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dispatch_target == 'ops' }}
    timeout-minutes: 90
    env:
      REAL_LLM_API_KEY: ${{ secrets.RSXERMU_KEY }}
    steps:
      - name: Require REAL_LLM_API_KEY (R0.1 缺 key 真 fail，不假绿)
        if: ${{ env.REAL_LLM_API_KEY == '' }}
        run: |
          echo "::error::REAL_LLM_API_KEY 未配置（secrets.RSXERMU_KEY 为空）。real-llm job 必须有 key 才能真跑——缺 key 直接 fail，不静默跳过假绿（R0.1）。"
          exit 1
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/powershell \
            /usr/lib/jvm "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install Rust toolchain
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry / target
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        uses: Swatinem/rust-cache@v2

      - name: cargo test --test real_llm_ops_smoke ${{ github.event.inputs.ops_test }}
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        env:
          RUSTFLAGS: ""
          # 手动单跑切 rsxermu666.cn 不限流端点（主 claude-opus-4-8 走 Anthropic 非
          # 流式；judge gpt-5.4 走 OpenAI，端点强制流式 SSE 由 LlmClient 聚合兜底），
          # 避免 NVIDIA 429 让多轮弧 turn-1 即 skip 出假绿。仅影响手动单跑入口。
          REAL_LLM_BASE_URL: https://rsxermu666.cn
          REAL_LLM_MODEL: claude-opus-4-8
          REAL_LLM_FORMAT: anthropic
          REAL_LLM_JUDGE: "1"
          JUDGE_SAMPLES: "1"
          REAL_LLM_JUDGE_API_KEY: ${{ secrets.RSXERMU_KEY }}
          REAL_LLM_JUDGE_BASE_URL: https://rsxermu666.cn/v1
          REAL_LLM_JUDGE_MODEL: gpt-5.4
          REAL_LLM_JUDGE_FORMAT: openai
        run: cargo test --no-fail-fast --test real_llm_ops_smoke ${{ github.event.inputs.ops_test }} -- --ignored --nocapture

  # Strict manual gate for the complete Reply -> Review -> send -> Reaction stop arc.
  # This job intentionally has no continue-on-error: provider errors, weak content,
  # review failures, reaction misclassification, or a duplicate send make the job red.
  real-llm-smoke-t4:
    name: Real-LLM smoke T4 strict transcript
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dispatch_target == 'smoke_t4' }}
    timeout-minutes: 60
    env:
      REAL_LLM_API_KEY: ${{ secrets.RSXERMU_KEY }}
      REAL_LLM_LEDGER: target/real_llm_ledger
    steps:
      - name: Require REAL_LLM_API_KEY
        if: ${{ env.REAL_LLM_API_KEY == '' }}
        run: |
          echo "::error::REAL_LLM_API_KEY is required for the strict T4 gate."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/powershell \
            /usr/lib/jvm "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install Rust toolchain
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        uses: Swatinem/rust-cache@v2

      - name: Run deterministic async ownership redlines
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        env:
          RUSTFLAGS: ""
          RUST_MIN_STACK: "8388608"
        shell: bash
        run: |
          count="$(cargo test --test outbox_integration -- --list | grep -c '^delivery_redline_.*: test$')"
          test "$count" -eq 4
          cargo test --test outbox_integration delivery_redline_ -- --ignored --nocapture
          reaction_count="$(cargo test --test reaction_claim_lock -- --list | grep -c '^reaction_redline_.*: test$')"
          test "$reaction_count" -eq 2
          cargo test --test reaction_claim_lock reaction_redline_ -- --ignored --nocapture

      - name: Run strict T4 with full transcript
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        env:
          RUSTFLAGS: ""
          RUST_MIN_STACK: "8388608"
          REAL_LLM_BASE_URL: https://rsxermu666.cn
          REAL_LLM_MODEL: claude-opus-4-8
          REAL_LLM_FORMAT: anthropic
        run: cargo test --test real_llm_smoke t4_real_reply_review_reaction_stop_cancels_before_second_send -- --ignored --exact --nocapture

      - name: Upload T4 business transcript
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: real-llm-smoke-t4-business-transcript
          path: target/real_llm_ledger/t4_business_transcript.json
          if-no-files-found: warn
          retention-days: 30

  # 知识库内容质量套件（real_llm_knowledge_quality.rs Q1–Q7）——「裁判校准层」重构后
  # 升级为跨家族裁判团（MiMo 双 checkpoint mimo-v2.5-pro + mimo-v2.5，外加**异族** Qwen
  # via DashScope，#618 最高 ROI 杠杆兑现）+ 跨裁判分歧效度门 + 每 Q 金标 good/bad 校准锚
  # + JSONL 台账。判分从单模型自评（self-enhancement bias）变成多裁判各 median-of-3、
  # 保守取低裁决；三态正交：跨裁判分歧大 → skip（结论不可信，绝不据此放水，含「MiMo 同
  # 家族一致高但异族 Qwen 判低」这一家族级盲区被照出的情形）；多裁判一致 <
  # MIN_QUALITY_FLOOR(6.0) → fail（修生产代码绝不放水）；校准锚拉不开 → skip。硬命中红线
  # （cite⊆seed / 恒 draft+needs_review / 只产 proposal / 审计只读 / 修复不落库 / 双数组
  # + Q2 确定性召回与泛化差距门）原位不动。缺 QWEN_JUDGE_API_KEY 自动回落 MiMo 双裁判，
  # 不退化；Qwen 打的是 DashScope 独立端点，不加重共享 MiMo key 的 429 压力。
  #
  # 按 Q 用 matrix 拆并行：原先单 step 跑 Q1–Q7（round-3 实测 1097s），多裁判翻倍后朴素
  # 串行必爆 45min 墙。三招解：① run_quality_panel 把 panel×K（2~3 裁判×3）一次
  # join_all（单判分点串行→~1×latency）；② 校准 CALIB_RUNS=1；③ 按 Q matrix 拆并行，
  # 各 Q 独享整个 45min 墙（简单 Q ~2.5min，Q2 旗舰 ~16min），不砍 K=3 保科学性。
  # max-parallel:2 限流——7 Q + adversarial 7 弧 + smoke/knowledge/ops 共用同一把 MiMo
  # key，全并发会瞬时 429 风暴；限并发把瞬时请求压到 ~10 以内（队列中的 matrix job 不
  # 启动 timeout 计时，故每 Q 仍独享完整 45min 墙）。MCP 仍是桩（绝不真发微信）。台账
  # artifact `real-llm-ledger-{q}` 含逐裁判每维 / `<cross>` 分歧 / calib / verdict 行，
  # 驱动多轮「测→读分→定位短板→修生产代码→再测」收敛闭环。
  real-llm-quality:
    name: Real-LLM knowledge quality (${{ matrix.q }} 双裁判 / MCP 桩)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dispatch_target == 'nightly_full') }}
    # 串行链第 4 环（见 real-llm-recall 注释：跨 group 串行守 rsxermu 并发 2）。
    needs: real-llm-ops
    continue-on-error: true
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        q:
          - q1_retrieval_price_objection_quality
          - q2_article_extraction_quality
          - q3_vision_extraction_quality
          - q4_chat_workstation_quality
          - q5_completeness_audit_quality
          - q6_repair_patch_quality
          - q7_tag_extraction_quality
          - q8_honest_abstention_quality
    env:
      # 被测内容生成 + 文本双裁判全迁 rsxermu666.cn：被测 claude-opus-4-8（Anthropic）、裁判
      # gpt-5.4（OpenAI /v1）。`if:` 守卫读此 job 级 env，空 key 时各步自动跳过。key 走 RSXERMU_KEY。
      REAL_LLM_API_KEY: ${{ secrets.RSXERMU_KEY }}
    steps:
      - name: Require REAL_LLM_API_KEY (R0.1 缺 key 真 fail，不假绿)
        if: ${{ env.REAL_LLM_API_KEY == '' }}
        run: |
          echo "::error::REAL_LLM_API_KEY 未配置（secrets.RSXERMU_KEY 为空）。real-llm job 必须有 key 才能真跑——缺 key 直接 fail，不静默跳过假绿（R0.1）。"
          exit 1
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/powershell \
            /usr/lib/jvm "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install Rust toolchain
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry / target
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        uses: Swatinem/rust-cache@v2

      # Quality is a matrix job as well; never let a cached Q3/Q4 outcome survive into this shard.
      - name: Reset real-LLM evidence ledger
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        shell: bash
        run: rm -rf target/real_llm_ledger && mkdir -p target/real_llm_ledger

      - name: cargo test --test real_llm_knowledge_quality ${{ matrix.q }}
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        env:
          RUSTFLAGS: ""
          # 被测内容生成 + 文本裁判全迁 rsxermu666.cn：被测 claude-opus-4-8（Anthropic /v1/messages）、
          # 文本裁判 gpt-5.4（OpenAI /v1，端点强制流式 SSE 由 LlmClient 聚合兜底）。被测/裁判跨家族
          # （anthropic/openai），跨家族分歧暴露 rubric 歧义。可选第三族 Qwen（NVIDIA）再加一层。
          REAL_LLM_BASE_URL: https://rsxermu666.cn
          REAL_LLM_MODEL: claude-opus-4-8
          REAL_LLM_FORMAT: anthropic
          JUDGE_SAMPLES: "1"
          # 文本裁判端点（quality_judge_panel 读独立 REAL_LLM_JUDGE_* / 缺则回落主 base）。rsxermu 下
          # judge 仅 gpt-5.4 一款文本模型，双 checkpoint 塌成同模型；跨家族效度靠下方可选异族 Qwen 承担。
          REAL_LLM_JUDGE_BASE_URL: https://rsxermu666.cn/v1
          REAL_LLM_JUDGE_MODEL: gpt-5.4
          REAL_LLM_JUDGE_FORMAT: openai
          REAL_LLM_JUDGE_LITE_MODEL: gpt-5.4
          # vision 链路（Q3）：被测抽取使用 NVIDIA Nemotron VL；独立视觉裁判仍使用下方
          # VISION_JUDGE_* 配置，两者不共享模型，避免自评同源。
          REAL_LLM_VISION_API_KEY: ${{ secrets.NVIDIA_KEY }}
          REAL_LLM_VISION_BASE_URL: https://integrate.api.nvidia.com/v1
          REAL_LLM_VISION_MODEL: nvidia/nemotron-nano-12b-v2-vl
          # Q3 vision **裁判团**（真看图判「图 vs 抽取文本」）：被测抽取走 Nemotron，vision 裁判
          # 用可选 NVIDIA llama-3.2-90b-vision（Meta 家族，与被测模型不同）。独立 VISION_JUDGE_API_KEY
          # （无字面量回落）；缺此 key → vision_judge_panel 返回 None → Q3 skip 不 fail。
          VISION_JUDGE_API_KEY: ${{ secrets.VISION_JUDGE_API_KEY }}
          VISION_JUDGE_BASE_URL: https://integrate.api.nvidia.com/v1
          VISION_JUDGE_MODEL: meta/llama-3.2-90b-vision-instruct
          REAL_LLM_LEDGER: target/real_llm_ledger
          # 可选第三异族裁判：NVIDIA 托管 qwen3-next-80b（qwen 家族）——与被测 claude（anthropic）、
          # 主裁判 gpt（openai）三方跨家族，照出家族级盲区（#618）。独立 NVIDIA_KEY（无字面量回落，
          # 用户清理 NVIDIA key 后自动回落 claude+gpt 两族，CI 不 fail）。NVIDIA 异端点不占 rsxermu 并发。
          QWEN_JUDGE_API_KEY: ${{ secrets.NVIDIA_KEY }}
          QWEN_JUDGE_BASE_URL: https://integrate.api.nvidia.com/v1
          QWEN_JUDGE_MODEL: qwen/qwen3-next-80b-a3b-instruct
        run: cargo test --no-fail-fast --test real_llm_knowledge_quality ${{ matrix.q }} -- --ignored --nocapture

      - name: Upload score ledger
        if: ${{ always() && env.REAL_LLM_API_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: real-llm-ledger-${{ matrix.q }}
          path: target/real_llm_ledger/
          if-no-files-found: ignore
          retention-days: 30

  # ════════════════════════════════════════════════════════════════════════════
  # 对抗式科学测试仪表台（Phase A：先校准仪器，agent 冻结为对照）。
  # real_llm_adversarial.rs 五合一：① 红队对手 agent（读真回复升级攻击）
  # ② 多裁判团 + 跨裁判分歧信号（MiMo 双 checkpoint = 效度代理）
  # ③ 金标集裁判效度校准（命中率 = 准不准）④ 分数台账 JSONL artifact 跨轮对比
  # ⑤ 长期运行能力弧（回填跨周历史 + 手动 consolidation 量化记忆/画像漂移）。
  #
  # 用 matrix 把每条弧切到独立并行 runner——每个 arc 各享独立墙（calibration 90min、其余 45min，
  # 见下 timeout-minutes 表达式），互不阻塞（fail-fast:false）。各 arc 只 `cargo test <name>` 跑自己
  # 那一片，抗墙腰斩（judge K=3 采样、红队多轮、长程回填都很慢）。
  # Phase A 全软诊断（唯一硬断言是 gateway 闭集），continue-on-error:true 不卡合并。
  # MCP 仍是桩（绝不真发微信）。台账末尾 upload-artifact 传出跨轮人工/脚本对比。
  real-llm-adversarial:
    name: Real-LLM adversarial (${{ matrix.arc }})
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dispatch_target == 'nightly_full') }}
    # 串行链末环（见 real-llm-recall 注释：跨 group 串行守 rsxermu 并发 2）。
    needs: real-llm-quality
    continue-on-error: true
    # 每弧独享墙。t_judge_calibration 是仪器最重的一片——20 金标 × 4 裁判 × K=3 = 240 次真模型调用，
    # Round 9 硬日志实测 ~208s/金标 × 20 ≈ 70min（GLM 单调 ~17s × K=3 同端点串行 + 偶发 json_decode
    # 5 重退避尾巴），Round 9/10/11 连三轮卡 45min 墙被腰斩（仅 ~12.5/20 金标完成、零裁判出闸退出门）。
    # 用户确认 45min 是我们自设非平台限制（GH hosted runner 默认 360min），据日志抬此弧到 90min 让 240
    # 调用真跑完；其余对抗弧 ~6 轮、有 failover 兜底，45min 足够，不抬以免单弧失控空烧 CI 分钟。
    timeout-minutes: ${{ matrix.arc == 't_judge_calibration' && 120 || 90 }}
    strategy:
      fail-fast: false
      # max-parallel:1 + needs 串行链：本 group 是 5 个 real-LLM group 串行的末环，各弧 K=3 judge
      # 采样(join_all 并发)+红队多轮生成同打一把 NVIDIA integrate key，跨 group 并发会爆 429
      # （实测 retry 6 仍全 skip）。串行 + 组内 1 把全局并发压到 1 runner。队列中的 matrix job 不启动
      # timeout 计时，故每弧仍独享各自完整墙（calibration 120min / 其余 90min），限流只推迟开始不吃墙。
      max-parallel: 1
      matrix:
        arc:
          - t_judge_calibration
          - t_adv_price_objection
          - t_adv_human_takeover_bait
          - t_adv_contradiction_trap
          - t_adv_fake_emotion_bait
          - t_adv_knowledge_fabrication_bait
          - t_adv_prompt_injection
          - t_longrun_capability
    env:
      # 全迁 rsxermu666.cn（2026-06-16）：被测 agent = claude-opus-4-8（Anthropic），judge1 = gpt-5.4
      # （OpenAI /v1，跨家族），可选第二/三裁判 = NVIDIA Qwen/GLM（异端点不占 rsxermu 并发）。
      # `if:` 守卫读 job 级此 env，空 key 时整个 adversarial job 各步自动跳过、不红不耗 CI 分钟。
      REAL_LLM_API_KEY: ${{ secrets.RSXERMU_KEY }}
    steps:
      - name: Require REAL_LLM_API_KEY (R0.1 缺 key 真 fail，不假绿)
        if: ${{ env.REAL_LLM_API_KEY == '' }}
        run: |
          echo "::error::REAL_LLM_API_KEY 未配置（secrets.RSXERMU_KEY 为空）。real-llm job 必须有 key 才能真跑——缺 key 直接 fail，不静默跳过假绿（R0.1）。"
          exit 1
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/powershell \
            /usr/lib/jvm "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install Rust toolchain
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry / target
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        uses: Swatinem/rust-cache@v2

      - name: cargo test --test real_llm_adversarial ${{ matrix.arc }}
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        env:
          RUSTFLAGS: ""
          # 被测 agent = claude-opus-4-8（REAL_LLM_MODEL，Anthropic）；主裁判 judge1 = gpt-5.4
          # （REAL_LLM_JUDGE1_MODEL，OpenAI /v1，与被测 claude 跨家族，自评干净不逐字背书）。
          # judge1 走独立 REAL_LLM_JUDGE_BASE_URL/_FORMAT（claude /v1/messages、gpt /v1/chat/completions
          # 端点串异故必须独立接线）。**不配 REAL_LLM_JUDGE_API_KEY**：judge1 的 key 经 judge_key 回落
          # 取主 RSXERMU_KEY；这样 strongest_model_client（读 JUDGE_API_KEY）返 None，agent failover 不被
          # 激活，被测纯度保住（被测恒 claude，不会抖动时切成 gpt）。
          REAL_LLM_BASE_URL: https://rsxermu666.cn
          REAL_LLM_MODEL: claude-opus-4-8
          REAL_LLM_FORMAT: anthropic
          REAL_LLM_JUDGE1_MODEL: gpt-5.4
          REAL_LLM_JUDGE_BASE_URL: https://rsxermu666.cn/v1
          REAL_LLM_JUDGE_MODEL: gpt-5.4
          REAL_LLM_JUDGE_FORMAT: openai
          REAL_LLM_VISION_MODEL: gpt-5.4
          REAL_LLM_JUDGE: "1"
          JUDGE_SAMPLES: "1"
          REAL_LLM_LEDGER: target/real_llm_ledger
          # 可选第二/三异族裁判 = NVIDIA Qwen / GLM（异端点不占 rsxermu 并发）。独立 NVIDIA_KEY
          # （无字面量回落，用户清理 NVIDIA key 后自动回落 claude+gpt 两族，judge_panel 退回 2 裁判不 fail）。
          # 被测 claude(anthropic) + judge1 gpt(openai) + 可选 qwen/glm 多族交叉，照出家族盲区（#618）。
          REAL_LLM_JUDGE2_API_KEY: ${{ secrets.NVIDIA_KEY }}
          REAL_LLM_JUDGE2_BASE_URL: https://integrate.api.nvidia.com/v1
          REAL_LLM_JUDGE2_MODEL: qwen/qwen3-next-80b-a3b-instruct
          REAL_LLM_JUDGE3_API_KEY: ${{ secrets.NVIDIA_KEY }}
          REAL_LLM_JUDGE3_BASE_URL: https://integrate.api.nvidia.com/v1
          REAL_LLM_JUDGE3_MODEL: z-ai/glm-5.1
        run: cargo test --no-fail-fast --test real_llm_adversarial ${{ matrix.arc }} -- --ignored --nocapture

      - name: Upload score ledger
        if: ${{ always() && env.REAL_LLM_API_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: real-llm-ledger-${{ matrix.arc }}
          path: target/real_llm_ledger/
          if-no-files-found: ignore
          retention-days: 30

  # 手动单跑：roleplay-fuzz P0 那几个需要 Docker（testcontainers MongoDB）的 #[ignore]
  # 夹具自验证测试。**无 needs 前置链、无任何 LLM key**——只验夹具本身（seed active
  # DomainProfile 经缓存失效后能读回 / 默认 ws 仍回落 DEFAULT / reviewer prompt 覆写在
  # ensure_prompt_pack_v2 之后胜出 / verified chunk 能写入），不调真模型、不烧配额。
  # 仅 workflow_dispatch + dispatch_target=roleplay_docker 触发；正常 PR/push 跑全套不受
  # 影响（这些测试在 integration job 的全量 --ignored 里本就会被一起跑到，本 job 只是给
  # 一个轻量、即时、单独的验证入口）。
  roleplay-docker:
    name: Roleplay P0 Docker fixtures (手动单跑 / 无 LLM)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dispatch_target == 'roleplay_docker' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 同 integration job：清预装 SDK 腾 ~30GB，否则 target + mongo 镜像撑爆磁盘。
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/powershell \
            /usr/lib/jvm "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry / target
        uses: Swatinem/rust-cache@v2

      # ubuntu-latest runner 预装 Docker daemon；testcontainers 自动拉起临时 MongoDB
      # 容器。关 -Dwarnings 同 integration job 理由（测试文件陈年 warning 不阻断真实跑测）。
      # --include-ignored 同时跑 #[ignore]（4 个需 Docker）与非 ignore 的 ledger 单测，
      # 一次拿全 5 个 P0 自验证结果。--nocapture 让诊断行进 CI 日志。
      - name: cargo test --test roleplay_fixtures_smoke (testcontainers MongoDB)
        env:
          RUSTFLAGS: ""
        run: cargo test --no-fail-fast --test roleplay_fixtures_smoke -- --include-ignored --nocapture

  # 手动单跑：roleplay-fuzz P2 情感陪伴固定场景全链 E2E（真模型 + testcontainers MongoDB）。
  # 在「default」ws seed 一个情感陪伴 active DomainProfile（非销售域），跑设计 §6.2 的夜间
  # 情绪低落 4 轮固定台词，走真实 handle_managed_message 全链（Reply Agent→Reviewer→gateway），
  # 硬断言确定性契约（status 闭集 / 不复读 / 无第三方承接），情感陪伴中性 judge 只观测不拦。
  # **无 needs 前置链**——立即起跑，不必等 real-llm 串行链。env 与 real-llm-ops-single 同口径
  # （主模型 kimi / 异族裁判 llama-3.3-70b / NVIDIA failover 链 + REAL_LLM_JUDGE=1）。
  # 仅 workflow_dispatch + dispatch_target=roleplay_p2 触发；正常 PR/push 不受影响（P2 测试
  # #[ignore]，在 integration job 全量 --ignored 里本就会被跑到，本 job 只给即时单独入口）。
  roleplay-p2:
    name: Roleplay P2 情感陪伴全链 E2E (手动单跑 / 真模型)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dispatch_target == 'roleplay_p2' }}
    timeout-minutes: 90
    env:
      REAL_LLM_API_KEY: ${{ secrets.RSXERMU_KEY }}
    steps:
      - name: Require REAL_LLM_API_KEY (R0.1 缺 key 真 fail，不假绿)
        if: ${{ env.REAL_LLM_API_KEY == '' }}
        run: |
          echo "::error::REAL_LLM_API_KEY 未配置（secrets.RSXERMU_KEY 为空）。real-llm job 必须有 key 才能真跑——缺 key 直接 fail，不静默跳过假绿（R0.1）。"
          exit 1
      - name: Checkout
        uses: actions/checkout@v4

      # 同 integration job：清预装 SDK 腾 ~30GB，否则 target + mongo 镜像撑爆磁盘。
      - name: Free disk space
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/powershell \
            /usr/lib/jvm "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install Rust toolchain
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry / target
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        uses: Swatinem/rust-cache@v2

      # 全迁 rsxermu666.cn：被测 claude-opus-4-8（Anthropic）、judge gpt-5.4（OpenAI /v1，端点强制
      # 流式 SSE 由 LlmClient 聚合兜底）。情感陪伴中性 judge 只观测不拦。JUDGE_SAMPLES=1 控并发。
      - name: cargo test --test roleplay_emotional_companion_e2e (real LLM + testcontainers)
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        env:
          RUSTFLAGS: ""
          REAL_LLM_BASE_URL: https://rsxermu666.cn
          REAL_LLM_MODEL: claude-opus-4-8
          REAL_LLM_FORMAT: anthropic
          REAL_LLM_JUDGE: "1"
          JUDGE_SAMPLES: "1"
          REAL_LLM_JUDGE_API_KEY: ${{ secrets.RSXERMU_KEY }}
          REAL_LLM_JUDGE_BASE_URL: https://rsxermu666.cn/v1
          REAL_LLM_JUDGE_MODEL: gpt-5.4
          REAL_LLM_JUDGE_FORMAT: openai
        run: cargo test --no-fail-fast --test roleplay_emotional_companion_e2e -- --ignored --nocapture

      - name: Upload roleplay ledger
        if: ${{ always() && env.REAL_LLM_API_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: roleplay-p2-ledger
          path: target/real_llm_ledger/
          if-no-files-found: ignore
          retention-days: 30

  # 手动单跑：reviewer 高压识别校准（固定候选回复直喂真 reviewer + 异族 judge 交叉）。
  # 验证情感 profile 下 reviewer 既不误杀合理关心、也不漏判控制式高压。无 needs，立即起跑。
  # 仅 workflow_dispatch + dispatch_target=reviewer_calibration 触发。env 与 roleplay-p2 同口径。
  reviewer-calibration:
    name: Reviewer 高压识别校准 (手动单跑 / 真模型)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dispatch_target == 'reviewer_calibration' }}
    timeout-minutes: 90
    env:
      REAL_LLM_API_KEY: ${{ secrets.RSXERMU_KEY }}
    steps:
      - name: Require REAL_LLM_API_KEY (R0.1 缺 key 真 fail，不假绿)
        if: ${{ env.REAL_LLM_API_KEY == '' }}
        run: |
          echo "::error::REAL_LLM_API_KEY 未配置（secrets.RSXERMU_KEY 为空）。real-llm job 必须有 key 才能真跑——缺 key 直接 fail，不静默跳过假绿（R0.1）。"
          exit 1
      - name: Checkout
        uses: actions/checkout@v4

      # 同 integration job：清预装 SDK 腾 ~30GB，否则 target + mongo 镜像撑爆磁盘。
      - name: Free disk space
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/powershell \
            /usr/lib/jvm "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install Rust toolchain
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry / target
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        uses: Swatinem/rust-cache@v2

      # 端点 rsxermu666.cn 不限流（仅并发敏感）：主模型 claude-opus-4-8 走 Anthropic
      # 非流式；judge gpt-5.4 走 OpenAI（该端点强制流式 SSE，LlmClient 已支持聚合 +
      # 剥离 <think> 前缀）。异厂商天然异族。JUDGE_SAMPLES=1 + 不配 failover 控并发。
      - name: cargo test --test roleplay_reviewer_pressure_calibration (real LLM + testcontainers)
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        env:
          RUSTFLAGS: ""
          REAL_LLM_BASE_URL: https://rsxermu666.cn
          REAL_LLM_MODEL: claude-opus-4-8
          REAL_LLM_FORMAT: anthropic
          REAL_LLM_JUDGE: "1"
          JUDGE_SAMPLES: "1"
          REAL_LLM_JUDGE_API_KEY: ${{ secrets.RSXERMU_KEY }}
          REAL_LLM_JUDGE_BASE_URL: https://rsxermu666.cn/v1
          REAL_LLM_JUDGE_MODEL: gpt-5.4
          REAL_LLM_JUDGE_FORMAT: openai
        run: cargo test --no-fail-fast --test roleplay_reviewer_pressure_calibration -- --ignored --nocapture

      - name: Upload calibration ledger
        if: ${{ always() && env.REAL_LLM_API_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: reviewer-calibration-ledger
          path: target/real_llm_ledger/
          if-no-files-found: ignore
          retention-days: 30

  # 手动单跑：R5.1 LLM 演客户动态博弈链（roleplayer 真演客户 × agent 真回应 × 多轮闭合）。
  # 三族异族（R5.0.1）：agent=claude-opus-4-8（RSXERMU/Anthropic）、roleplayer=NVIDIA
  # llama-3.3-70b（NVIDIA_KEY，第三族，独立端点不占 rsxermu 并发）。judge 本条不接（R5.2
  # trajectory judge 后续）——只验博弈链通 + gateway status 闭集硬断言 + roleplayer 不出戏。
  # 仅 workflow_dispatch + dispatch_target=roleplay_arc 触发。无 needs，立即起跑。
  roleplay-arc:
    name: Roleplay R5.1 动态博弈链 (手动单跑 / 三族真模型)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dispatch_target == 'roleplay_arc' }}
    timeout-minutes: 90
    env:
      REAL_LLM_API_KEY: ${{ secrets.RSXERMU_KEY }}
      ROLEPLAYER_API_KEY: ${{ secrets.NVIDIA_KEY }}
    steps:
      - name: Require REAL_LLM_API_KEY (R0.1 缺 key 真 fail，不假绿)
        if: ${{ env.REAL_LLM_API_KEY == '' }}
        run: |
          echo "::error::REAL_LLM_API_KEY 未配置（secrets.RSXERMU_KEY 为空）。被测 agent 必须有 key 才能真跑——缺 key 直接 fail，不静默跳过假绿（R0.1）。"
          exit 1
      - name: Require ROLEPLAYER_API_KEY (R0.1 缺第三族 key 真 fail，不假绿)
        if: ${{ env.ROLEPLAYER_API_KEY == '' }}
        run: |
          echo "::error::ROLEPLAYER_API_KEY 未配置（secrets.NVIDIA_KEY 为空）。roleplayer 是第三异族（R5.0.1），缺 key 则博弈链全程 fallback=假绿——直接 fail，不静默跳过。"
          exit 1
      - name: Checkout
        uses: actions/checkout@v4

      # 同 integration job：清预装 SDK 腾 ~30GB，否则 target + mongo 镜像撑爆磁盘。
      - name: Free disk space
        if: ${{ env.REAL_LLM_API_KEY != '' && env.ROLEPLAYER_API_KEY != '' }}
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/powershell \
            /usr/lib/jvm "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install Rust toolchain
        if: ${{ env.REAL_LLM_API_KEY != '' && env.ROLEPLAYER_API_KEY != '' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry / target
        if: ${{ env.REAL_LLM_API_KEY != '' && env.ROLEPLAYER_API_KEY != '' }}
        uses: Swatinem/rust-cache@v2

      # 被测 agent = claude-opus-4-8（rsxermu666.cn / Anthropic 非流式）；roleplayer 走默认
      # NVIDIA llama-3.3-70b @ temperature 0.8（with_temperature 覆盖生产默认 0.2）。两端点
      # 异厂商天然异族，且 NVIDIA 异端点不占 rsxermu 并发。
      - name: cargo test --test real_llm_roleplay_arc (3 异族真模型 + testcontainers)
        if: ${{ env.REAL_LLM_API_KEY != '' && env.ROLEPLAYER_API_KEY != '' }}
        env:
          RUSTFLAGS: ""
          REAL_LLM_BASE_URL: https://rsxermu666.cn
          REAL_LLM_MODEL: claude-opus-4-8
          REAL_LLM_FORMAT: anthropic
          ROLEPLAYER_BASE_URL: https://integrate.api.nvidia.com/v1
          ROLEPLAYER_MODEL: meta/llama-3.3-70b-instruct
          ROLEPLAYER_FORMAT: openai
          ROLEPLAYER_TEMPERATURE: "0.8"
        run: cargo test --no-fail-fast --test real_llm_roleplay_arc -- --ignored --nocapture

      - name: Upload roleplay arc ledger
        if: ${{ always() && env.REAL_LLM_API_KEY != '' && env.ROLEPLAYER_API_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: roleplay-arc-ledger
          path: target/real_llm_ledger/
          if-no-files-found: ignore
          retention-days: 30

  # ════════════════════════════════════════════════════════════════════════════
  # 真模型红线门（R2.2 跨域全链 / R2.5.3 请示通道 / R5 动态对抗 / 主动外联）。
  #
  # 这些 redline 文件过去**无任何带 key 的专用 CI 入口**——只在无 key 的 integration job 里
  # 被编译，require_real_llm! 取不到 key 即 return（skip=PASS），承载的转真人/泄露身份/
  # relay 不暴露真人等**确定性红线断言从不在真 LLM 下执行 = 假绿**（深度审查 G1 critical）。
  # 本 job 给它们补真 key 入口。
  #
  # 与其余 real-llm group 不同：**本 job 不设 continue-on-error**（G2）。这些文件经红线
  # 词表硬化后，主体是确定性红线 panic + unwrap_or_skip_transient!（端点抖动→skip 不 fail）。
  # 故红线击穿必须真红卡合并，而端点 5xx/超时仍走 skip 不误红。串行链末环（needs adversarial，
  # 守 rsxermu 并发 ≤2）。matrix 内 max-parallel:1 同理。
  real-llm-redline:
    name: Real-LLM 红线门 (${{ matrix.file }} / 确定性硬断言)
    runs-on: ubuntu-latest
    # 仅 nightly schedule 跑（真模型红线是评估/优化 agent 行为的，不为每次 PR 变绿而烧
    # 配额；PR 阶段红线靠 baseline job 内的 check-no-human-takeover / check-no-model-hint
    # 字符串级 lint 兜底，真模型对话行为红线由 nightly 全量回归 + 手动 workflow_dispatch 单跑）。
    # 保留 needs: real-llm-adversarial 让 nightly 时排在能力套件链末，串行守 rsxermu 并发≤2。
    needs: real-llm-adversarial
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dispatch_target == 'nightly_full') }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        file:
          - real_llm_cross_domain_arc
          - real_llm_principal_channel
          - real_llm_proactive_outreach
          - real_llm_dynamic_adversarial
          - real_llm_digital_twin_arc
          - real_llm_principal_relay
          - real_llm_roleplay_arc
    env:
      REAL_LLM_API_KEY: ${{ secrets.RSXERMU_KEY }}
      ROLEPLAYER_API_KEY: ${{ secrets.NVIDIA_KEY }}
    steps:
      - name: Require REAL_LLM_API_KEY (R0.1 缺 key 真 fail，不假绿)
        if: ${{ env.REAL_LLM_API_KEY == '' }}
        run: |
          echo "::error::REAL_LLM_API_KEY 未配置（secrets.RSXERMU_KEY 为空）。红线门必须有 key 才能真跑——缺 key 直接 fail，不静默跳过假绿（R0.1）。"
          exit 1
      - name: Require ROLEPLAYER_API_KEY (R0.1 缺第三族 key 真 fail，不假绿)
        if: ${{ env.ROLEPLAYER_API_KEY == '' }}
        run: |
          echo "::error::ROLEPLAYER_API_KEY 未配置（secrets.NVIDIA_KEY 为空）。roleplayer 是第三异族（R5.0.1），缺 key 则数字分身 redline arc turn-0 静默 skip=假绿——直接 fail，不静默跳过。"
          exit 1
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/powershell \
            /usr/lib/jvm "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install Rust toolchain
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry / target
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        uses: Swatinem/rust-cache@v2

      # Each redline matrix shard must upload only evidence produced by this run/attempt.
      - name: Reset real-LLM evidence ledger
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        shell: bash
        run: rm -rf target/real_llm_ledger && mkdir -p target/real_llm_ledger

      # 被测 agent = claude-opus-4-8（Anthropic）。cross_domain 的 judge / dynamic 的轨迹裁判
      # 走 gpt-5.4（OpenAI /v1，跨家族）；dynamic 的 roleplayer 第三族用 NVIDIA（异端点，缺则
      # assert_three_families_distinct 自 skip 不 fail）。红线硬断言不依赖 judge，judge 仅观测。
      - name: cargo test --test ${{ matrix.file }} (红线硬断言 + skip-on-transient)
        if: ${{ env.REAL_LLM_API_KEY != '' }}
        env:
          RUSTFLAGS: ""
          REAL_LLM_BASE_URL: https://rsxermu666.cn
          REAL_LLM_MODEL: claude-opus-4-8
          REAL_LLM_FORMAT: anthropic
          REAL_LLM_JUDGE1_MODEL: gpt-5.4
          REAL_LLM_JUDGE_BASE_URL: https://rsxermu666.cn/v1
          REAL_LLM_JUDGE_MODEL: gpt-5.4
          REAL_LLM_JUDGE_FORMAT: openai
          REAL_LLM_JUDGE: "1"
          JUDGE_SAMPLES: "1"
          REAL_LLM_LEDGER: target/real_llm_ledger
          # dynamic_adversarial 第三族异族 roleplayer/judge（缺则回落两族不 fail）。
          REAL_LLM_JUDGE2_API_KEY: ${{ secrets.NVIDIA_KEY }}
          REAL_LLM_JUDGE2_BASE_URL: https://integrate.api.nvidia.com/v1
          REAL_LLM_JUDGE2_MODEL: qwen/qwen3-next-80b-a3b-instruct
          ROLEPLAYER_API_KEY: ${{ secrets.NVIDIA_KEY }}
          ROLEPLAYER_BASE_URL: https://integrate.api.nvidia.com/v1
          ROLEPLAYER_MODEL: qwen/qwen3-next-80b-a3b-instruct
        run: cargo test --no-fail-fast --test ${{ matrix.file }} -- --ignored --nocapture

      - name: Upload skip ledger
        if: ${{ always() && env.REAL_LLM_API_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: real-llm-ledger-redline-${{ matrix.file }}
          path: target/real_llm_ledger/
          if-no-files-found: ignore
          retention-days: 30

  # ════════════════════════════════════════════════════════════════════════════
  # R0.2：skip 率硬门（汇总）。各 real-llm job 是 continue-on-error（conclusion 恒
  # success，端点抖动不卡合并），但**大面积 transient-skip = 这一轮真模型测试实际
  # 没验证到能力 = 假绿**。本 job 非 continue-on-error，needs 5 个 PR 门真模型 job，
  # 汇总它们传出的 skip_ledger.jsonl，skip 总数超阈值即真红卡合并。
  # 缺 key（fork PR/没配 secret）时 5 个上游 job 在其 fail-gate 已红，本 job 因
  # needs 失败而 skipped，不会假绿。
  skip-gate:
    name: Real-LLM skip 率硬门 (R0.2)
    runs-on: ubuntu-latest
    # 仅 nightly schedule 跑：本门是真模型 job 的 skip 率兜底，PR 阶段已不跑任何真模型
    # job（redline 也移走），无 ledger 可汇总，故一起移到 schedule。nightly 时 redline
    # 跑完它汇总（needs 保证顺序），download pattern `*ledger*` 抓能力套件 + redline 全部 ledger。
    needs: [real-llm-redline]
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dispatch_target == 'nightly_full') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # 汇总所有真模型 job 传出的 ledger（含 skip_ledger.jsonl）到一个目录。
      # pattern 覆盖各 job 的命名：real-llm-skip-ledger-* / real-llm-recall-ledger-* /
      # real-llm-ledger-*（quality/adversarial）。merge-multiple 把多 artifact 合进同目录。
      - name: Download all skip ledgers
        uses: actions/download-artifact@v4
        with:
          path: target/real_llm_ledger
          pattern: "*ledger*"
          merge-multiple: true
      - name: Check skip rate
        env:
          REAL_LLM_LEDGER: target/real_llm_ledger
          # 5 个 job 汇总，放宽到 12（单 job ~3-16 测试，端点偶发抖动允许少量；
          # 持续抖动致大面积 skip 才红）。可按实际调。
          REAL_LLM_MAX_SKIP: "12"
        run: bash scripts/check-skip-ledger.sh
      # SR-128/SR-178：skip 总量门之外，关键能力与红线必须各自产出可审计的正向终态。
      # 缺失、重复、零调用、零产物、零断言、inconclusive/infra_skip 均硬失败，
      # 防止 continue-on-error 的上游矩阵或测试内 early-return 形成假绿。
      - name: Check required capability outcomes
        env:
          REAL_LLM_LEDGER: target/real_llm_ledger
        run: python3 scripts/check-capability-outcomes.py
