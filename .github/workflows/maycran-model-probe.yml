name: Maycran model probe (temporary)

on:
  push:
    branches:
      - test/maycran-llm-backfill-20260802

permissions:
  contents: read

jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MAYCRAN_API_KEY: ${{ secrets.MAYCRAN_KEY }}
    steps:
      - name: Require temporary credential
        shell: bash
        run: test -n "$MAYCRAN_API_KEY" || { echo "::error::MAYCRAN_KEY is missing"; exit 1; }

      - name: Probe candidate model IDs
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          candidates = [
              "claude-sonnet-4-6",
              "claude-sonnet-4.6",
              "claude-sonnet-4-5",
              "claude-opus-4-6",
              "gpt-5.6-auto",
              "codex-auto-review",
              "qwen3-coder-next",
              "deepseek-v4-pro",
          ]

          def probe(model, extra_headers):
              body = json.dumps({
                  "model": model,
                  "temperature": 0,
                  "max_tokens": 16,
                  "messages": [
                      {"role": "system", "content": "Return strict JSON only."},
                      {"role": "user", "content": "Return {\"ok\":true}."},
                  ],
              }).encode()
              headers = {
                  "Authorization": f"Bearer {os.environ['MAYCRAN_API_KEY']}",
                  "Content-Type": "application/json",
              }
              headers.update(extra_headers)
              request = urllib.request.Request(
                  "https://api.maycran.com/v1/chat/completions",
                  data=body,
                  headers=headers,
              )
              status = 0
              valid_shape = False
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      status = response.status
                      payload = json.load(response)
                      valid_shape = bool(
                          isinstance(payload, dict)
                          and isinstance(payload.get("choices"), list)
                          and payload["choices"]
                          and isinstance(payload["choices"][0], dict)
                          and isinstance(payload["choices"][0].get("message"), dict)
                          and isinstance(payload["choices"][0]["message"].get("content"), str)
                      )
              except urllib.error.HTTPError as error:
                  status = error.code
              except Exception:
                  status = -1
              return status, valid_shape

          header_profiles = {
              "default": {},
              "accept_only": {"Accept": "application/json"},
              "ua_only": {"User-Agent": "Mozilla/5.0 MaycranModelProbe/1.0"},
              "accept_and_ua": {
                  "Accept": "application/json",
                  "User-Agent": "Mozilla/5.0 MaycranModelProbe/1.0",
              },
          }
          for profile, headers in header_profiles.items():
              status, valid_shape = probe("claude-sonnet-4-6", headers)
              print(
                  f"HEADER_PROBE profile={profile} status={status} "
                  f"valid_shape={str(valid_shape).lower()}"
              )

          successes = []
          for model in candidates:
              status, valid_shape = probe(model, header_profiles["accept_and_ua"])
              print(f"MODEL_PROBE model={model} status={status} valid_shape={str(valid_shape).lower()}")
              if 200 <= status < 300 and valid_shape:
                  successes.append(model)
          if not successes:
              raise SystemExit("No candidate model produced a valid chat-completions response")
          print("USABLE_MODELS " + " ".join(successes))
          PY
