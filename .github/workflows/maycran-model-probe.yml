name: Maycran model probe (temporary)

on:
  push:
    branches:
      - test/maycran-llm-backfill-20260802

permissions:
  contents: read

jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MAYCRAN_API_KEY: ${{ secrets.MAYCRAN_KEY }}
    steps:
      - name: Require temporary credential
        shell: bash
        run: test -n "$MAYCRAN_API_KEY" || { echo "::error::MAYCRAN_KEY is missing"; exit 1; }

      - name: List available model IDs
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              "https://api.maycran.com/v1/models",
              headers={"Authorization": f"Bearer {os.environ['MAYCRAN_API_KEY']}"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          model_ids = sorted(
              row["id"]
              for row in payload.get("data", [])
              if isinstance(row, dict) and isinstance(row.get("id"), str)
          )
          if not model_ids:
              raise SystemExit("Maycran /models returned no model IDs")
          print("AVAILABLE_MODEL_IDS")
          print("\n".join(model_ids))
          PY
