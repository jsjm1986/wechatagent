name: Probe GPT Stream
on:
  workflow_dispatch:
    inputs:
      probe_key: { description: 'key', required: true, type: string }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: gpt stream:false 验证
        env:
          PROBE_KEY: ${{ github.event.inputs.probe_key }}
        run: |
          echo "===== gpt-5.4 + stream:false ====="
          curl -sS --max-time 90 https://rsxermu666.cn/v1/chat/completions \
            -H "Authorization: Bearer $PROBE_KEY" -H "content-type: application/json" \
            -d '{"model":"gpt-5.4","stream":false,"messages":[{"role":"user","content":"output strict json: {\"ok\":true}"}],"max_tokens":100}' \
            2>&1 | head -c 1500
          echo ""; echo "===== gpt-5.4-mini + stream:false ====="
          sleep 8
          curl -sS --max-time 90 https://rsxermu666.cn/v1/chat/completions \
            -H "Authorization: Bearer $PROBE_KEY" -H "content-type: application/json" \
            -d '{"model":"gpt-5.4-mini","stream":false,"messages":[{"role":"user","content":"output strict json: {\"ok\":true}"}],"max_tokens":100}' \
            2>&1 | head -c 1500
          echo ""; echo "===== 完成 ====="
