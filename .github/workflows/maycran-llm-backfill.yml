name: Maycran LLM backfill (temporary)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Backfill target to run
        required: true
        default: all
        type: choice
        options:
          - all
          - real_llm_smoke
          - domain_profile_e2e
          - real_llm_knowledge
          - real_llm_recall_benchmark
          - real_llm_ops_smoke
          - real_llm_knowledge_quality
          - real_llm_progressive_tier
          - real_llm_adversarial
          - real_llm_cross_domain_arc
          - real_llm_principal_channel
          - real_llm_proactive_outreach
          - real_llm_dynamic_adversarial
          - real_llm_digital_twin_arc
          - real_llm_principal_relay
          - real_llm_roleplay_arc
          - roleplay_emotional_companion_e2e
          - roleplay_reviewer_pressure_calibration
      test_filter:
        description: Optional exact cargo test-name filter for targeted validation
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: maycran-llm-backfill
  cancel-in-progress: false

jobs:
  backfill:
    name: Maycran backfill (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ fromJSON(inputs.target == 'all' && '["real_llm_smoke","domain_profile_e2e","real_llm_knowledge","real_llm_recall_benchmark","real_llm_ops_smoke","real_llm_knowledge_quality","real_llm_progressive_tier","real_llm_adversarial","real_llm_cross_domain_arc","real_llm_principal_channel","real_llm_proactive_outreach","real_llm_dynamic_adversarial","real_llm_digital_twin_arc","real_llm_principal_relay","real_llm_roleplay_arc","roleplay_emotional_companion_e2e","roleplay_reviewer_pressure_calibration"]' || format('["{0}"]', inputs.target)) }}
    env:
      RUSTFLAGS: ""
      RUST_MIN_STACK: "8388608"
      REAL_LLM_API_KEY: ${{ secrets.MAYCRAN_KEY }}
      REAL_LLM_BASE_URL: https://api.maycran.com/v1
      REAL_LLM_MODEL: claude-sonnet-4-6
      REAL_LLM_FORMAT: openai
      REAL_LLM_PRIMARY_MAX_RETRIES: "3"
      REAL_LLM_CANDIDATE_MAX_RETRIES: "3"
      REAL_LLM_SAME_ENDPOINT_FAILOVER_MODELS: qwen3-coder-next,deepseek-v4-pro,claude-opus-4-6
      REAL_LLM_VISION_API_KEY: ${{ secrets.MAYCRAN_KEY }}
      REAL_LLM_VISION_BASE_URL: https://api.maycran.com/v1
      REAL_LLM_VISION_MODEL: claude-sonnet-4-6
      REAL_LLM_JUDGE: "1"
      JUDGE_SAMPLES: "1"
      REAL_LLM_JUDGE_API_KEY: ${{ secrets.MAYCRAN_KEY }}
      REAL_LLM_JUDGE_BASE_URL: https://api.maycran.com/v1
      REAL_LLM_JUDGE_MODEL: qwen3-coder-next
      REAL_LLM_JUDGE1_MODEL: qwen3-coder-next
      REAL_LLM_JUDGE_LITE_MODEL: deepseek-v4-pro
      REAL_LLM_JUDGE_FORMAT: openai
      # The quality suite treats this optional slot as its third heterogeneous judge.
      # Keep it on an independent endpoint and model family from the two Maycran judges.
      QWEN_JUDGE_API_KEY: ${{ secrets.NVIDIA_KEY }}
      QWEN_JUDGE_BASE_URL: https://integrate.api.nvidia.com/v1
      QWEN_JUDGE_MODEL: meta/llama-3.3-70b-instruct
      ROLEPLAYER_API_KEY: ${{ secrets.NVIDIA_KEY }}
      ROLEPLAYER_BASE_URL: https://integrate.api.nvidia.com/v1
      ROLEPLAYER_MODEL: meta/llama-3.3-70b-instruct
      ROLEPLAYER_FORMAT: openai
      ROLEPLAYER_TEMPERATURE: "0.8"
      REAL_LLM_FAILOVER_API_KEY: ${{ secrets.NVIDIA_KEY }}
      REAL_LLM_FAILOVER_BASE_URL: https://integrate.api.nvidia.com/v1
      REAL_LLM_FAILOVER_MODELS: meta/llama-3.3-70b-instruct,z-ai/glm-5.1,stepfun-ai/step-3.7-flash
      REAL_LLM_JUDGE2_API_KEY: ${{ secrets.NVIDIA_KEY }}
      REAL_LLM_JUDGE2_BASE_URL: https://integrate.api.nvidia.com/v1
      REAL_LLM_JUDGE2_MODEL: meta/llama-3.3-70b-instruct
      VISION_JUDGE_API_KEY: ${{ secrets.VISION_JUDGE_API_KEY }}
      VISION_JUDGE_BASE_URL: https://integrate.api.nvidia.com/v1
      VISION_JUDGE_MODEL: meta/llama-3.2-90b-vision-instruct
      REAL_LLM_VISION_BACKUP_API_KEY: ${{ secrets.VISION_JUDGE_API_KEY }}
      REAL_LLM_VISION_BACKUP_BASE_URL: https://integrate.api.nvidia.com/v1
      REAL_LLM_VISION_BACKUP_MODEL: nvidia/llama-3.1-nemotron-nano-vl-8b-v1
      REAL_LLM_LEDGER: target/real_llm_ledger
      RECALL_STABILITY_RUNS: "3"
      TEST_FILTER: ${{ inputs.test_filter }}
      BACKFILL_TARGET: ${{ matrix.target }}
    steps:
      - name: Require temporary credentials
        shell: bash
        run: |
          test -n "$REAL_LLM_API_KEY" || { echo "::error::MAYCRAN_KEY is missing"; exit 1; }
          test -n "$ROLEPLAYER_API_KEY" || { echo "::error::NVIDIA_KEY is missing"; exit 1; }

      - name: Checkout temporary branch
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/powershell \
            /usr/lib/jvm "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: maycran-backfill

      - name: Reset evidence ledger
        shell: bash
        run: rm -rf "$REAL_LLM_LEDGER" && mkdir -p "$REAL_LLM_LEDGER"

      - name: Run real-LLM target serially
        shell: bash
        run: |
          test_args=()
          runner_args=(--ignored --test-threads=1 --nocapture)
          if [[ -n "$TEST_FILTER" ]]; then
            test_args+=("$TEST_FILTER")
            runner_args+=(--exact)
          fi
          printf 'target=%s test_filter=%s\n' \
            '${{ matrix.target }}' "${TEST_FILTER:-<all>}" | tee test.log
          set +e
          cargo test --locked --no-fail-fast --test "${{ matrix.target }}" \
            "${test_args[@]}" -- "${runner_args[@]}" \
            2>&1 | tee -a test.log
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > test.rc

      - name: Enforce real execution and positive evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rc=$(cat test.rc 2>/dev/null || printf '99')
          test "$rc" = 0 || { echo "::error::cargo test exited $rc"; exit 1; }
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re

          log = pathlib.Path("test.log").read_text(encoding="utf-8", errors="replace")
          results = [int(value) for value in re.findall(r"test result: ok\. (\d+) passed", log)]
          if not results or sum(results) <= 0:
              raise SystemExit("no ignored tests actually passed")
          skip_patterns = (r"(?im)^\s*skip:", r"(?im)\[SKIP\]", r"(?im)infra_skip")
          for pattern in skip_patterns:
              if re.search(pattern, log):
                  raise SystemExit(f"runtime skip marker found: {pattern}")

          root = pathlib.Path("target/real_llm_ledger")
          skip_ledger = root / "skip_ledger.jsonl"
          if skip_ledger.exists() and skip_ledger.read_text(encoding="utf-8").strip():
              raise SystemExit("skip_ledger is not empty")

          failures = []
          outcomes = list(root.rglob("capability_outcome.*.json"))
          for path in outcomes:
              row = json.loads(path.read_text(encoding="utf-8"))
              if row.get("verdict") != "pass":
                  failures.append(
                      f"{row.get('case_id')}: {row.get('verdict')} "
                      f"{row.get('skipped_reason', '')}"
                  )
              elif row.get("attempted") is not True or row.get("llm_calls", 0) <= 0:
                  failures.append(f"{row.get('case_id')}: missing positive LLM evidence")
          if failures:
              raise SystemExit("; ".join(failures))

          if os.environ.get("BACKFILL_TARGET") == "real_llm_knowledge_quality":
              expected = {
                  "q1_retrieval_price_objection_quality": ("Q1", 1),
                  "q2_article_extraction_quality": ("Q2", 16),
                  "q3_vision_extraction_quality": ("Q3", 1),
                  "q4_chat_workstation_quality": ("Q4", 1),
                  "q5_completeness_audit_quality": ("Q5", 1),
                  "q6_repair_patch_quality": ("Q6", 1),
                  "q7_tag_extraction_quality": ("Q7", 1),
                  "q8_honest_abstention_quality": ("Q8", 1),
              }
              selected = os.environ.get("TEST_FILTER", "")
              required = expected if not selected else {selected: expected.get(selected)}
              if None in required.values():
                  raise SystemExit(f"unknown knowledge-quality test filter: {selected}")

              quality_path = root / "quality.jsonl"
              if not quality_path.exists():
                  raise SystemExit("knowledge-quality run emitted no quality.jsonl")
              rows = []
              for line_no, line in enumerate(
                  quality_path.read_text(encoding="utf-8").splitlines(), start=1
              ):
                  if not line.strip():
                      continue
                  try:
                      rows.append(json.loads(line))
                  except json.JSONDecodeError as exc:
                      raise SystemExit(
                          f"invalid quality.jsonl line {line_no}: {exc}"
                      ) from exc

              all_verdicts = [
                  row
                  for row in rows
                  if row.get("suite") == "quality" and row.get("kind") == "verdict"
              ]
              bad_verdicts = [
                  row for row in all_verdicts if row.get("verdict") != "pass"
              ]
              if bad_verdicts:
                  raise SystemExit(f"non-pass quality verdicts: {bad_verdicts}")

              for _, (qid, expected_count) in required.items():
                  verdicts = [row for row in all_verdicts if row.get("qid") == qid]
                  scenes = {row.get("scene") for row in verdicts}
                  if len(verdicts) != expected_count or len(scenes) != expected_count:
                      raise SystemExit(
                          f"{qid} verdict coverage mismatch: rows={len(verdicts)} "
                          f"unique_scenes={len(scenes)} expected={expected_count}"
                      )
                  calibrations = [
                      row
                      for row in rows
                      if row.get("suite") == "quality"
                      and row.get("kind") == "calib"
                      and row.get("qid") == qid
                  ]
                  judges = {row.get("judge") for row in calibrations if row.get("judge")}
                  judge_models = {
                      row.get("model") for row in calibrations if row.get("model")
                  }
                  if len(judges) < 2:
                      raise SystemExit(
                          f"{qid} needs at least two calibrated judges; got {sorted(judges)}"
                      )
                  if len(judge_models) < 2:
                      raise SystemExit(
                          f"{qid} needs at least two distinct calibrated models; "
                          f"got {sorted(judge_models)}"
                      )
                  failed_calibrations = [
                      row for row in calibrations if row.get("ok") is not True
                  ]
                  if failed_calibrations:
                      raise SystemExit(
                          f"{qid} has failed judge calibrations: {failed_calibrations}"
                      )
              print(
                  "strict quality ledger passed: "
                  + ", ".join(
                      f"{qid}={count} pass verdicts"
                      for _, (qid, count) in required.items()
                  )
              )
          print(
              f"strict backfill passed: tests={sum(results)} "
              f"capability_outcomes={len(outcomes)} skips=0"
          )
          PY

      - name: Upload backfill evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maycran-backfill-${{ matrix.target }}
          path: |
            test.log
            test.rc
            target/real_llm_ledger/
          if-no-files-found: warn
          retention-days: 30
