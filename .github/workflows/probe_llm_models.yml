name: Probe LLM Models

on:
  workflow_dispatch:
    inputs:
      probe_key:
        description: 'API key'
        required: true
        type: string
      base_url:
        description: 'base url'
        required: true
        default: 'https://rsxermu666.cn'
        type: string

jobs:
  probe-models:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 逐个模型实测(串行,每次1并发避开3001)
        env:
          PROBE_KEY: ${{ github.event.inputs.probe_key }}
          BASE_URL: ${{ github.event.inputs.base_url }}
        run: |
          test_openai() {
            local m="$1"
            echo "----- [OpenAI] $m -----"
            curl -sS --max-time 60 "$BASE_URL/v1/chat/completions" \
              -H "Authorization: Bearer $PROBE_KEY" -H "content-type: application/json" \
              -d "{\"model\":\"$m\",\"messages\":[{\"role\":\"user\",\"content\":\"reply with just: OK\"}],\"max_tokens\":20}" \
              2>&1 | head -c 600
            echo ""; echo ""; sleep 8
          }
          test_anthropic() {
            local m="$1"
            echo "----- [Anthropic] $m -----"
            curl -sS --max-time 60 "$BASE_URL/v1/messages" \
              -H "x-api-key: $PROBE_KEY" -H "anthropic-version: 2023-06-01" -H "content-type: application/json" \
              -d "{\"model\":\"$m\",\"max_tokens\":20,\"messages\":[{\"role\":\"user\",\"content\":\"reply with just: OK\"}]}" \
              2>&1 | head -c 600
            echo ""; echo ""; sleep 8
          }
          echo "===== GPT 系(OpenAI 格式) ====="
          test_openai "gpt-5.5"
          test_openai "gpt-5.4"
          test_openai "gpt-5.4-mini"
          test_openai "gpt-5.2"
          test_openai "gpt-5.1-codex"
          echo "===== Claude 系(OpenAI 格式,确认 chat 接口能否调 claude) ====="
          test_openai "claude-opus-4-8"
          test_openai "claude-sonnet-4-6"
          echo "===== Claude 系(Anthropic 格式) ====="
          test_anthropic "claude-opus-4-7"
          test_anthropic "claude-sonnet-4-6"
          test_anthropic "claude-haiku-4-5"
          echo "===== 完成 ====="
